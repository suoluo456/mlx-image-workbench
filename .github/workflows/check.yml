name: Source and packaging checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU-only test dependencies
        run: python -m pip install pillow==12.3.0 psutil==7.1.1 requests==2.34.2
      - name: Test runtime and downloader without models
        run: python -m unittest discover -s tests -v
      - name: Test optional extension
        run: node --test tavern-extension/test-*.mjs
      - name: Check shell syntax
        run: for script in *.sh *.command scripts/*.sh; do bash -n "$script"; done
      - name: Audit selected public files and build archives
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-release-preview
          path: dist/*
